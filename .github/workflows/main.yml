name: Build and Release Binary

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: node20-linux-x64
            output: gemini-app-linux-x64
          - target: node20-win-x64
            output: gemini-app-win-x64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Bundle with esbuild
        run: npx esbuild index.js --bundle --platform=node --outfile=dist/bundle.js

      - name: Package to Binary
        run: npx @yao-pkg/pkg dist/bundle.js --target ${{ matrix.target }} --output ${{ matrix.output }}

      - name: Create Release and Upload Binary
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.output }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
