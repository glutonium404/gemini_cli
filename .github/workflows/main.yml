name: Build and Release Binary

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Bundle with esbuild
        run: npx esbuild index.js --bundle --platform=node --outfile=dist/bundle.js

      - name: Package to Binaries (Linux & Windows)
        run: |
          npx @yao-pkg/pkg dist/bundle.js --target node20-linux-x64 --output gemini-app-linux
          npx @yao-pkg/pkg dist/bundle.js --target node20-win-x64 --output gemini-app-win.exe

      - name: Create Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gemini-app-linux
            gemini-app-win.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
